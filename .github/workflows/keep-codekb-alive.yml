name: Keep code-knowledge-base alive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query code-knowledge-base
        env:
          CODEKB_URL: ${{ secrets.CODEKB_SUPABASE_URL }}
          CODEKB_KEY: ${{ secrets.CODEKB_SUPABASE_KEY }}
        run: |
          curl --fail -sS -o /dev/null \
            -H "apikey: $CODEKB_KEY" \
            -H "Authorization: Bearer $CODEKB_KEY" \
            "$CODEKB_URL/rest/v1/YOUR_TABLE?select=*&limit=1"
          echo "ping OK"
