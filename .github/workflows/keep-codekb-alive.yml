name: Keep code-knowledge-base alive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query code_chunks on Supabase
        env:
          SUPABASE_URL: ${{ secrets.CODEKB_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.CODEKB_SUPABASE_KEY }}
        run: |
          curl --fail -sS -o /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/code_chunks?select=chunk_name&limit=1"
          echo "ping OK"
